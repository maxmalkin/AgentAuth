[package]
name = "agentauth-verifier-bin"
description = "AgentAuth Verifier Service - read-only token verification, high replica count"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "verifier"
path = "src/main.rs"

[dependencies]
agentauth-core = { path = "../../crates/agentauth-core" }
agentauth-registry = { path = "../../crates/agentauth-registry" }

# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }

# Database (read replica only)
sqlx = { workspace = true }

# Redis
redis = { workspace = true }

# Cryptography
ring = { workspace = true }
ed25519-dalek = { workspace = true }
subtle = { workspace = true }

# UUID
uuid = { workspace = true }

# Time
chrono = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Tracing / Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Configuration
config = { workspace = true }
dotenvy = { workspace = true }

# Circuit breaker
failsafe = { workspace = true }

[lints]
workspace = true
