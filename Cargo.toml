[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/registry",
    "crates/sdk",
    "crates/py",
    "crates/schema",
    "services/registry",
    "services/verifier",
    "services/audit-archiver",
    "tests/compliance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentauth/agentauth"
authors = ["AgentAuth Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Web framework
axum = { version = "0.7", features = ["macros", "tracing"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip", "timeout", "limit"] }
hyper = { version = "1.2", features = ["full"] }
hyper-util = { version = "0.1" }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
prost = "0.12"
prost-types = "0.12"

# Database (default-features = false to avoid pulling in mysql/sqlite which have vulnerable deps)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
deadpool-postgres = "0.12"

# Redis
redis = { version = "0.25", features = ["tokio-comp", "cluster-async", "connection-manager"] }

# Cryptography
ring = "0.17"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2.0", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2.5"  # Constant-time comparisons
base64 = "0.22"
hex = "0.4"

# UUID
uuid = { version = "1.7", features = ["v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# Tracing / Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.23"
opentelemetry = { version = "0.22", features = ["trace"] }
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["tonic"] }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.14"

# Configuration
config = "0.14"
dotenvy = "0.15"

# URL parsing
url = { version = "2.5", features = ["serde"] }

# Circuit breaker
failsafe = "1.3"

# Rate limiting
governor = "0.6"

# Testing
tokio-test = "0.4"
wiremock = "0.6"
fake = { version = "2.9", features = ["derive"] }
proptest = "1.4"

# JSON Schema
schemars = "0.8"
jsonschema = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
