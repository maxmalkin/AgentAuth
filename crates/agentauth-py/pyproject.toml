[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "agentauth"
version = "0.1.0"
description = "Python SDK for AgentAuth - secure agent authentication"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AgentAuth Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
keywords = ["authentication", "agents", "ai", "security"]

[project.urls]
Repository = "https://github.com/agentauth/agentauth"
Documentation = "https://docs.agentauth.dev"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "agentauth"

[project.optional-dependencies]
langchain = ["langchain>=0.1.0"]
autogen = ["pyautogen>=0.2.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
