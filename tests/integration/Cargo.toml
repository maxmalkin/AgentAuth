[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[test]]
name = "integration"
path = "main.rs"

[dependencies]
auth_core = { package = "core", path = "../../crates/core" }
registry = { path = "../../crates/registry" }

tokio = { version = "1.36", features = ["full", "test-util"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
hyper = { version = "1.2", features = ["full"] }
http-body-util = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
sha2 = "0.10"
subtle = "2.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lints]
workspace = true
